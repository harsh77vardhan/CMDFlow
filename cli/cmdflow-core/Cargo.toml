[package]
name = "cmdflow-core"
version = "1.0.2"
edition = "2021"
authors = ["CMDFlow Team"]
description = "Core engine for CMDFlow command layer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
regex = "1.10"
glob = "0.3"
dirs = "5.0"
shellexpand = "3.1"
strsim = "0.11"
which = "6.0"

[dev-dependencies]
tempfile = "3.10"
