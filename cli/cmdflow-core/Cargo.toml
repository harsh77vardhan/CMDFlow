[package]
name = "cmdflow-core"
version = "0.1.0"
edition = "2021"
authors = ["CMDFlow Team"]
description = "Core engine for CMDFlow command layer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
regex = "1.10"
glob = "0.3"
dirs = "5.0"
shellexpand = "3.1"
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
which = "6.0"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
