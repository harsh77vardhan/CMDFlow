name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: cmdflow
            asset_name: cmdflow-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: cmdflow
            asset_name: cmdflow-linux-arm64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: cmdflow
            asset_name: cmdflow-darwin-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: cmdflow
            asset_name: cmdflow-darwin-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: cmdflow.exe
            asset_name: cmdflow-windows-x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build settings-ui
        run: |
          cd settings-ui
          npm ci || npm install
          npx vite build
          cd ..

      - name: Build Binary
        run: |
          cd cli
          cargo build --release --target ${{ matrix.target }}
          cd ..

      - name: Package Unix Archive
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C cli/target/${{ matrix.target }}/release ${{ matrix.binary_name }}
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package Windows Archive
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "cli\target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.asset_name }}"
          Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }} | Out-File "${{ matrix.asset_name }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Aggregate Checksums
        run: |
          cat */*.sha256 > SHA256SUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*.tar.gz
            */*.zip
            SHA256SUMS.txt
          generate_release_notes: true
