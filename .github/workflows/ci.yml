name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cargo Format Check
        run: cd cli && cargo fmt --check

      - name: Cargo Clippy
        run: cd cli && cargo clippy --all-targets -- -D warnings

      - name: Cargo Test
        run: cd cli && cargo test --workspace

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Worker Unit Tests
        run: npm run test:worker

      - name: Website & Worker Build
        run: npm run build

      - name: Shell Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y fish zsh
          cargo build --release --manifest-path cli/Cargo.toml
          sudo cp cli/target/release/cmdflow /usr/local/bin/
          ./scripts/e2e.sh

      - name: Shell Integration Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          sudo cp cli/target/release/cmdflow /usr/local/bin/
          zsh shell/tests/test_zsh.sh
          bash shell/tests/test_bash.sh

      - name: PowerShell Integration Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          $env:Path = "$PWD\cli\target\release;$env:Path"
          cmdflow.exe doctor
          cmdflow.exe alias add b "cd .."
          cmdflow.exe alias list
          cmdflow.exe explain b
